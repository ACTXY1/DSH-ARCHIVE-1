# dsh-archive-memory 的 bundle 补丁（供其他 profile 复用的行模板）。
# 本项目的 archive profile 在 C:/DSH-ARCHIVE\dsh\cordis.patch.yml 中直接引用
# 同一行（name 相同），此处为随包分发的标准形态。
- insert:
    - id: archive-memory
      name: dsh-archive-memory
      config:
        dbPath: C:/DSH-ARCHIVE/dsh/data/memory.db
        ollamaBaseUrl: http://127.0.0.1:11434
        model: shaw/dmeta-embedding-zh:latest
        timeoutMs: 60000
