# DSH-ARCHIVE 项目补丁层（bundle 层之后应用）。自定义插件逐行追加于此。
#

# 提示词/报错全量记录（dsh-archive-ledger）
#  - 必须最先插入：logger 工厂/console/fetch/ctx.llm/进程级五路钩子须在其它模块 apply 前生效
#  - ctx.archiveLedger 服务 + /archive-ledger RPC（总控底部「提示词/报错」面板数据源）
- insert:
    - id: archive-ledger
      name: dsh-archive-ledger
      config:
        dataPath: C:/DSH-ARCHIVE/dsh/data/ledger

# 跨会话全局记忆系统（dsh-archive-memory）
#  - ctx.memory 服务 + memory_write/recall/forget/stats 工具
#  - 用户画像 user_profile_set/get/remove + 用户状态 user_state_set/get/clear 工具
#  - 向量：ollama shaw/dmeta-embedding-zh（768 维）；存储：SQLite（C:/DSH-ARCHIVE/dsh/data/memory.db）
#  - 每回合经 systemPrompt 动态 context 注入"当前用户状态 + 画像要点"
- insert:
    - id: archive-memory
      name: dsh-archive-memory
      config:
        dbPath: C:/DSH-ARCHIVE/dsh/data/memory.db
        ollamaBaseUrl: http://127.0.0.1:11434
        model: shaw/dmeta-embedding-zh:latest
        timeoutMs: 60000
        defaultStateTtlSeconds: 14400

# 人格系统入口（dsh-archive-persona）
#  - ctx.persona 服务 + persona_view/set/update 工具
#  - persona.json 权威存储 + persona-history.jsonl 追加式留档（含完整快照，可回滚）
#  - systemPrompt 动态 context(persona-identity, order 500) 每回合注入人格
- insert:
    - id: archive-persona
      name: dsh-archive-persona
      config:
        personaPath: C:/DSH-ARCHIVE/dsh/data/persona.json
        injectOrder: 500
        injectEnabled: true

# 虚拟时钟（dsh-archive-clock）
#  - ctx.virtualClock 服务 + 启动同步/周期校准 + <time> 注入(order 200)
- insert:
    - id: archive-clock
      name: dsh-archive-clock
      config:
        calibrateMs: 60000
        injectOrder: 200
        injectEnabled: true

# 自循环思考驱动器（dsh-archive-loop）
#  - 事件触发 + 定时兜底（默认 5 分钟，loop_config 可运行时调整）
#  - 每循环：召回记忆→结合用户状态/人格/时间分析场景→决定行为（主动能力唯一决策点）
#  - 后果评估 + 行动预算/发言限频/空转抑制/超时；循环日志写回记忆(source=loop)
#  - 用户主动发消息后暂停时间驱动循环（对话让路窗），窗口内只跑对话循环；运行中的
#    时间驱动循环被立即中止并清理记录/回退行为（防并行决策用同一时刻记忆 → 割裂对话）
#  - 睡眠期语义：状态 TTL 到期≠醒来，睡眠期持续至真实唤醒信号（用户消息/状态清除
#    或改标签/任务打断），杜绝睡眠中连环主动打扰
- insert:
    - id: archive-loop
      name: dsh-archive-loop
      config:
        enabled: true
        fallbackIntervalMs: 300000
        tickMs: 30000
        initialDelayMs: 30000
        thinkTimeoutMs: 120000
        # thinkTimeoutMs：思维循环 LLM 总上限（双 Agent 两段调用需较大余量）
        provider: deepseek-official
        model: deepseek-v4-flash
        maxActionsPerCycle: 1
        maxActionsPerDay: 20
        minSpeakIntervalMs: 30000
        recallRecent: 5
        recallRelated: 5
        injectOrder: 900
        quietAfterUserMs: 60000
        # quietAfterUserMs：对话让路窗（防串线靠上下文注入，窗口仅兜底）
        # maxTokens：单次决策 token 预算（推理模型 reasoning 占用大，10000 预留充足空间）
        # 总控「思维循环」页运行配置可运行时调整（无需重启）。
        maxTokens: 10000
        # 睡眠/清醒期：用户"睡眠中"持续 ≥sleepEnterDelayMs 且未来
        # sleepCheckWindowMs 内无 pending 任务 → 进入睡眠期（循环完全暂停）。
        # 仅真实唤醒信号解除——定时任务/用户消息/状态被清除或改标
        # 为其他状态；sleepMaxMs 仅作"无 TTL 睡眠行（直到手动清除）"的绝对兜底上限
        # （正常带 TTL 的睡眠到期≠醒来，保持静默，防夜行长睡眠被连环打扰）。
        sleepEnterDelayMs: 1800000
        sleepMaxMs: 28800000
        sleepCooldownMs: 10800000
        sleepCheckWindowMs: 28800000

# 自进化系统（dsh-archive-evolution）
#  - 候选生成→隔离评估→安全门→用户授权采纳/拒绝/回滚（不自动生效）
#  - 进化对象：虚拟人格（ctx.persona by='evolution'）+ 技能（data/skills 技能库）
#  - 每次进化留档：data/evolution.jsonl 追加式账本
#  - 自动建议：每日 autoHour 自动生成候选（by='auto'，仅候选+评估+留档，不自动采纳），
#    生成 ≥1 条新候选时经 notify 主动告知；人格←对话总结（persona 六维度），skill←对话/工作提炼
- insert:
    - id: archive-evolution
      name: dsh-archive-evolution
      config:
        ledgerPath: C:/DSH-ARCHIVE/dsh/data/evolution.jsonl
        skillsDir: C:/DSH-ARCHIVE/dsh/data/skills
        provider: deepseek-official
        model: deepseek-v4-flash
        maxConflict: 0.5
        autoSuggest: true
        autoHour: 22
        autoNotify: true

# 主动消息通道（dsh-archive-notify）：控制台 + notifications.jsonl 流水
- insert:
    - id: archive-notify
      name: dsh-archive-notify
      config:
        notificationsPath: C:/DSH-ARCHIVE/dsh/data/notifications.jsonl
        consoleEnabled: true
        minIntervalMs: 30000
        cleanupRetentionDays: 7

# 定时任务（dsh-archive-schedule）：告诉 AI 几点干什么 → 到点发消息/干活
- insert:
    - id: archive-schedule
      name: dsh-archive-schedule
      config:
        dbPath: C:/DSH-ARCHIVE/dsh/data/tasks.db
        checkMs: 30000
        cleanupRetentionDays: 7

# 总控界面（dsh-archive-control）：Host RPC + Client 设置页"智能体总控"面板
# dataRoot：数据根显式配置（与 memory/schedule/notify 一致）；
# 备份根 = 项目根 backups（dataRoot 上级）。
- insert:
    - id: archive-control
      name: dsh-archive-control
      config:
        dataRoot: C:/DSH-ARCHIVE/dsh/data

# 图像识别：参照 dsh-web-all 组件 @linxin666/dsh-tool-describe-image
#  - Host: describe_image 工具（agent 可识别本地路径/http(s) URL/附件引用图片）
#  - Client: webui 输入框图片按钮 + 会话内图片引用渲染 + 设置页"Image understanding"配置
#  - 密钥经全局凭据服务解析 DEEPSEEK_API_KEY（~/.dsh/.credentials.yaml）
- insert:
    - id: archive-describe-image
      name: '@linxin666/dsh-tool-describe-image'
      config:
        baseURL: https://api.deepseek.com/v1
        model: deepseek-v4-flash-vision-exp
        apiKeyEnv: DEEPSEEK_API_KEY

# 潜意识系统·梦境引擎（dsh-archive-subconscious）：异步后台进程，只在睡眠期触发。
# ①记忆脱粒机：过去 24h 高频记忆(accessCount≥3) → 聚类 → 本地 Phi-3:mini（随包内置，可选用
# DeepSeek）凝缩为原型陈述入潜记忆池；②异质碰撞器：池内随机 2 条不相关(余弦<0.3)原型 →
# DeepSeek 哲学隐喻关联生成进化草案（附自洽置信度 0-100）；③调度：自洽≥80 且新颖度≥60 →
# 待审批队列顶部（by='dream' 高优先级）；自洽>95 且梯度一致且 autoApply 开启 → 自动微调
# （仅 persona 类，通知+自进化栏「灵感进化」单列，保留回滚）；④梦境回放：苏醒生成梦境呓语，
# 下次对话话题相关时隐式注入。Phi 模型管理（下载/删除二次确认）在自进化页。
- insert:
    - id: archive-subconscious
      name: dsh-archive-subconscious
      config:
        dataPath: C:/DSH-ARCHIVE/dsh/data/subconscious.json
        enabled: true
        condenseModel: phi
        llmModel: deepseek
        autoApply: false

# 人格一致性校验器（dsh-archive-consistency）：滑动窗口人格轨迹（最近 100 轮
# 交互 + 最近 5 条已审批进化建议的 768 维向量）+ PCA 3 维坐标 + 突变梯度拦截（G<α 放行 /
# α≤G≤β 局部重写 / G>β 强制刹车重生成）+ 进化审批协同（航点入轨 + β 动态抬高 + 倒叙修正）。
# 总控界面「人格一致性」开关 + 「一致性」功能页；embedding 复用 memory 同源 ollama。
- insert:
    - id: archive-consistency
      name: dsh-archive-consistency
      config:
        trajectoryPath: C:/DSH-ARCHIVE/dsh/data/consistency.json
        enabled: true
        windowSize: 100
        waypointMax: 5
        lastN: 20
        scopedSessions:
          - session-main

# web_fetch 抓取 provider：宿主侧 node fetch（绕开沙箱受限令牌的
# schannel TLS 限制）。背景：windows-acl 受限令牌下 AcquireCredentialsHandle 失败
# （SEC_E_NO_CREDENTIALS），沙箱内 pwsh/curl 的 HTTPS 全挂，宿主进程 fetch 正常。
# 本行注册 ctx.web 的 fetch provider；web_fetch 工具在 standard 副本 preset
# （archive-standard，~/.dsh/.agent-presets/）中开启（tool-web fetch: true）。
- insert:
    - id: archive-web-fetch
      name: dsh-archive-web-fetch

# Web 性能优化（dsh-archive-web-perf）：/assets gzip+immutable 缓存、
# Service Worker 缓存 /plugins 客户端模块（刷新秒开）。纯 Host 插件，三端同步生效。
- insert:
    - id: archive-web-perf
      name: dsh-archive-web-perf

# 本项目为独立 DSH 实例：会话/工作区/设置/凭据/附件
# 全部落于项目内（dsh/data 下），不再共享全局 ~/.dsh（否则会看到其他 DSH 环境的记录）。
- id: session-persistence-jsonl
  config:
    root: C:/DSH-ARCHIVE/dsh/data/sessions
- id: storage-domain
  config:
    backend: json
    root: C:/DSH-ARCHIVE/dsh/data/storages
- id: storage-json
  config:
    root: C:/DSH-ARCHIVE/dsh/data/storages
- id: settings
  config:
    path: C:/DSH-ARCHIVE/dsh/data/settings.yaml
- id: credentials
  config:
    path: C:/DSH-ARCHIVE/dsh/data/credentials.yaml
- id: attachment-local
  config:
    dshHome: C:/DSH-ARCHIVE/dsh/data/home
