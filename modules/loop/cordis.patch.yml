# dsh-archive-loop 的行模板（随包分发；archive profile 在 C:/DSH-ARCHIVE\dsh\cordis.patch.yml 引用）。
- insert:
    - id: archive-loop
      name: dsh-archive-loop
      config:
        enabled: true
        fallbackIntervalMs: 300000
        tickMs: 30000
        initialDelayMs: 30000
        thinkTimeoutMs: 60000
        provider: deepseek-official
        model: deepseek-v4-flash
        maxActionsPerCycle: 1
        maxActionsPerDay: 20
        minSpeakIntervalMs: 30000
        recallRecent: 5
        recallRelated: 5
        injectOrder: 900
        # 用户主动发消息后暂停时间驱动循环（fallback/startup/hour）的时长；
        # 窗口内只运行对话循环（pre-turn），运行中的时间驱动循环被立即中止并清理记录（防并行决策割裂对话）
        quietAfterUserMs: 180000
        # 单次决策 token 预算（deepseek-v4-flash 推理模型 reasoning 会大量占用，
        # 过小致正文截断 → "LLM 未返回文本" → 循环失败风暴；总控「思维循环」页可运行时调整）
        maxTokens: 10000
